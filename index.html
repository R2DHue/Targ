<script>// Compact NMOS 6502 core (documented opcodes) - written for this project
function CPU6502(read, write){

  c.a=0;c.x=0;c.y=0;c.s=0xfd;c.pc=0;c.p=0x24;c.cycles=0;c.irqLine=false;

  c.reset=()=>{c.pc=rw(0xfffc);c.s=0xfd;c.p|=I;};
  c.interrupt=(vec,brk)=>{push(c.pc>>8);push(c.pc&255);push((c.p|0x20)&~B|(brk?B:0));c.p|=I;c.pc=rw(vec);c.cycles+=7;};

  zpx=()=>{ea=(rd(c.pc)+c.x)&255;c.pc=(c.pc+1)&0xffff;}, zpy=()=>{ea=(rd(c.pc)+c.y)&255;c.pc=(c.pc+1)&0xffff;},
  abs=()=>{ea=rw(c.pc);c.pc=(c.pc+2)&0xffff;},
  abx=()=>{const b=rw(c.pc);c.pc=(c.pc+2)&0xffff;ea=(b+c.x)&0xffff;if((b^ea)&0x100)extra=1;},
  aby=()=>{const b=rw(c.pc);c.pc=(c.pc+2)&0xffff;ea=(b+c.y)&0xffff;if((b^ea)&0x100)extra=1;},
  izx=()=>{const z=(rd(c.pc)+c.x)&255;c.pc=(c.pc+1)&0xffff;ea=rd(z)|(rd((z+1)&255)<<8);},
  izy=()=>{const z=rd(c.pc);c.pc=(c.pc+1)&0xffff;const b=rd(z)|(rd((z+1)&255)<<8);ea=(b+c.y)&0xffff;if((b^ea)&0x100)extra=1;},
  ind=()=>{const p=rw(c.pc);c.pc=(c.pc+2)&0xffff;ea=rd(p)|(rd((p&0xff00)|((p+1)&255))<<8);};
  const adc=v=>{ if(c.p&D){let lo=(c.a&15)+(v&15)+(c.p&C),hi=(c.a>>4)+(v>>4);if(lo>9){lo+=6;hi++;}
      const bin=(c.a+v+(c.p&C))&255; c.p=(c.p&~(Z|N|V|C))|(bin?0:Z)|((hi<<4)&N)|((~(c.a^v)&(c.a^(hi<<4))&0x80)?V:0);

    else{const r=c.a+v+(c.p&C);c.p=(c.p&~(V|C))|(r>255?C:0)|((~(c.a^v)&(c.a^r)&0x80)?V:0);c.a=nz(r&255);} };
  const sbc=v=>{ if(c.p&D){const cin=c.p&C;let lo=(c.a&15)-(v&15)-(1-cin),hi=(c.a>>4)-(v>>4);
      const r=c.a-v-(1-cin);if(lo<0){lo-=6;hi--;} if(hi<0)hi-=6;

  rol=v=>{const r=((v<<1)|(c.p&C))&255;c.p=(c.p&~C)|(v>>7);return nz(r);}, ror=v=>{const r=(v>>1)|((c.p&C)<<7);c.p=(c.p&~C)|(v&1);return nz(r);};
  const M={imm,zp,zpx,zpy,abs,abx,aby,izx,izy};

  const ALU=[['ora',0x00],['and',0x20],['eor',0x40],['adc',0x60],['sta',0x80],['lda',0xa0],['cmp',0xc0],['sbc',0xe0]];
  const modes=[[0x09,'imm',2],[0x05,'zp',3],[0x15,'zpx',4],[0x0d,'abs',4],[0x1d,'abx',4],[0x19,'aby',4],[0x01,'izx',6],[0x11,'izy',5]];
  const af={ora:()=>{c.a=nz(c.a|rd(ea));},and:()=>{c.a=nz(c.a&rd(ea));},eor:()=>{c.a=nz(c.a^rd(ea));},adc:()=>adc(rd(ea)),

  def([[0xa2,'imm',2],[0xa6,'zp',3],[0xb6,'zpy',4],[0xae,'abs',4],[0xbe,'aby',4]],()=>{c.x=nz(rd(ea));},1);
  def([[0xa0,'imm',2],[0xa4,'zp',3],[0xb4,'zpx',4],[0xac,'abs',4],[0xbc,'abx',4]],()=>{c.y=nz(rd(ea));},1);
  def([[0x86,'zp',3],[0x96,'zpy',4],[0x8e,'abs',4]],()=>wr(ea,c.x));
  def([[0x84,'zp',3],[0x94,'zpx',4],[0x8c,'abs',4]],()=>wr(ea,c.y));
  def([[0xe0,'imm',2],[0xe4,'zp',3],[0xec,'abs',4]],()=>cmp(c.x,rd(ea)));
  def([[0xc0,'imm',2],[0xc4,'zp',3],[0xcc,'abs',4]],()=>cmp(c.y,rd(ea)));
  def([[0x24,'zp',3],[0x2c,'abs',4]],()=>{const v=rd(ea);c.p=(c.p&~(N|V|Z))|(v&(N|V))|((v&c.a)?0:Z);});
  const shifts=[[0x00,asl],[0x20,rol],[0x40,lsr],[0x60,ror]];
  for(const [b,f] of shifts){ T[b+0x0a]=()=>{c.a=f(c.a);c.cycles+=2;};
    def([[b+0x06,'zp',5],[b+0x16,'zpx',6],[b+0x0e,'abs',6],[b+0x1e,'abx',7]],()=>rmw(f)); }
  def([[0xe6,'zp',5],[0xf6,'zpx',6],[0xee,'abs',6],[0xfe,'abx',7]],()=>rmw(v=>nz((v+1)&255)));
  def([[0xc6,'zp',5],[0xd6,'zpx',6],[0xce,'abs',6],[0xde,'abx',7]],()=>rmw(v=>nz((v-1)&255)));
  const imp=(op,cy,f)=>T[op]=()=>{f();c.cycles+=cy;};
  imp(0xe8,2,()=>{c.x=nz((c.x+1)&255);});imp(0xca,2,()=>{c.x=nz((c.x-1)&255);});
  imp(0xc8,2,()=>{c.y=nz((c.y+1)&255);});imp(0x88,2,()=>{c.y=nz((c.y-1)&255);});
  imp(0xaa,2,()=>{c.x=nz(c.a);});imp(0x8a,2,()=>{c.a=nz(c.x);});imp(0xa8,2,()=>{c.y=nz(c.a);});imp(0x98,2,()=>{c.a=nz(c.y);});
  imp(0xba,2,()=>{c.x=nz(c.s);});imp(0x9a,2,()=>{c.s=c.x;});
  imp(0x48,3,()=>push(c.a));imp(0x68,4,()=>{c.a=nz(pop());});imp(0x08,3,()=>push(c.p|0x30));imp(0x28,4,()=>{c.p=(pop()&~B)|0x20;});
  imp(0x18,2,()=>{c.p&=~C;});imp(0x38,2,()=>{c.p|=C;});imp(0x58,2,()=>{c.p&=~I;});imp(0x78,2,()=>{c.p|=I;});
  imp(0xb8,2,()=>{c.p&=~V;});imp(0xd8,2,()=>{c.p&=~D;});imp(0xf8,2,()=>{c.p|=D;});imp(0xea,2,()=>{});

  T[0x20]=()=>{const t=rw(c.pc);const r=(c.pc+1)&0xffff;push(r>>8);push(r&255);c.pc=t;c.cycles+=6;};

  T[0x40]=()=>{c.p=(pop()&~B)|0x20;const lo=pop(),hi=pop();c.pc=(hi<<8)|lo;c.cycles+=6;};

  const brs=[[0x10,()=>!(c.p&N)],[0x30,()=>c.p&N],[0x50,()=>!(c.p&V)],[0x70,()=>c.p&V],[0x90,()=>!(c.p&C)],[0xb0,()=>c.p&C],[0xd0,()=>!(c.p&Z)],[0xf0,()=>c.p&Z]];

</script><script>// Exidy "Targ" board emulation (original JS, hardware behaviour per MiSTer Exidy2 docs / schematics)
function TargMachine(roms){ // roms: {prog: Uint8Array(0x2800) for 0x1800-0x3fff, sprites: Uint8Array(0x400)}
  const m=this;
  const ram=new Uint8Array(0x400), vram=new Uint8Array(0x400), cram=new Uint8Array(0x800);
  m.ram=ram;m.vram=vram;m.cram=cram;
  m.s1x=0;m.s1y=0;m.s2x=0;m.s2y=0;m.mol=0;m.cpl=0;m.eir=0xff;
  // DIP 16A per Targ Operator's Manual 1.0 (switch N = bit N-1, OFF = 1):
  // sw1 unused(coin B idle)=1, sw2 English-only=OFF, sw3 ON=credit for topping score,
  // sw4 OFF/sw5 ON = 1 player-1 coin, sw6 ON/sw7 OFF = 3 Wummels, sw8 OFF = quarters
  m.dip=0xCB;
  m.inp={coin:0,start1:0,start2:0,up:0,down:0,left:0,right:0,fire:0};
  m.sndWrites=[];
  const prog=roms.prog, spr=roms.sprites;
  function esr(){const i=m.inp;return ((!i.coin)<<7)|((!i.down)<<6)|((!i.up)<<5)|((!i.fire)<<4)|((!i.left)<<3)|((!i.right)<<2)|((!i.start2)<<1)|(!i.start1)|0;}
  function read(a){
    if(a<0x400)return ram[a];
    if(a>=0x1800&&a<0x4000)return prog[a-0x1800];
    if(a>=0xf800)return prog[a-0xf800+0x2000];
    if(a>=0x4000&&a<0x4800)return vram[a&0x3ff];
    if(a>=0x4800&&a<0x5000)return cram[a&0x7ff];
    if(a>=0x5100&&a<0x5200){switch(a&3){case 0:return m.dip;case 1:return esr();case 3:m.cpu.irqLine=false;return m.eir;default:return 0xff;}}
    if(a>=0x5200&&a<0x5210)return m.sndRead?m.sndRead(a):0;
    if(a===0x5213)return 0x04;
    return 0xff;
  }
  function write(a,v){
    if(a<0x400){ram[a]=v;return;}
    if(a>=0x4000&&a<0x4800){vram[a&0x3ff]=v;return;}
    if(a>=0x4800&&a<0x5000){cram[a&0x7ff]=v;return;}
    if(a>=0x5000&&a<0x5100){switch(a&0xc0){case 0:m.s1x=v;break;case 0x40:m.s1y=v;break;case 0x80:m.s2x=v;break;case 0xc0:m.s2y=v;break;}return;}
    if(a>=0x5100&&a<0x5200){if((a&3)===0)m.mol=v;else if((a&3)===1)m.cpl=v;return;}
    if(a>=0x5200&&a<0x5300){if(m.sndWrite)m.sndWrite(a,v);return;}
  }
  m.cpu=new CPU6502(read,write);
  m.reset=()=>{m.cpu.reset();};
  const CYC=Math.round(11289000/16/60);
  let prevCoin=0;
  m.frame=()=>{
    const cpu=m.cpu;
    // coin edge raises an interrupt too
    if(m.inp.coin&&!prevCoin){m.eir=0x80|0x40|0x1f; m.cpu.irqLine=true;}
    prevCoin=m.inp.coin;
    const end=cpu.cycles+CYC;
    const vbAt=cpu.cycles+Math.round(CYC*256/280);
    let vbDone=false;
    while(cpu.cycles<end){
      if(!vbDone&&cpu.cycles>=vbAt){vbDone=true; m.eir=(0<<7)|((m.inp.coin?1:0)<<6)|0x1f; cpu.irqLine=true;}
      cpu.step();
    }
  };
  // palette: index 0 sprite1, 1 sprite2, 3..6 char sets, 7 bg
  // Targ colour adapter jumpers (Outerworld Arcade table): ship green, missile white,
  // chars $00-3F red, $40-7F cyan, $80-BF yellow, $C0-FF cyan, background blue
  m.palette=[[0,255,0],[255,255,255],[0,0,0],[0,255,255],[255,255,0],[0,255,255],[255,0,0],[0,0,255]];
  m.render=(img)=>{ // img: Uint32Array 256*256 ABGR
    const pal=m.palette.map(([r,g,b])=>0xff000000|(b<<16)|(g<<8)|r);
    for(let ty=0;ty<32;ty++)for(let tx=0;tx<32;tx++){
      const code=vram[ty*32+tx], col=pal[6-(code>>6)], bg=pal[7], blank=m.hiEnemies&&code<0x20;
      for(let r=0;r<8;r++){const bits=blank?0:cram[code*8+r];let o=(ty*8+r)*256+tx*8;
        for(let b=0;b<8;b++)img[o+b]=(bits&(0x80>>b))?col:bg;}
    }
    const drawS=(code,xp,yp,c)=>{const sx=236-xp-4, sy=244-yp-4;
      for(let half=0;half<2;half++)for(let r=0;r<16;r++){const bits=spr[(code&31)*32+half*16+r];
        const y=sy+r; if(y<0||y>255)continue;
        for(let b=0;b<8;b++){const x=sx+half*8+b; if(x<0||x>255)continue; if(bits&(0x80>>b))img[y*256+x]=c;}}};
    drawS((m.mol>>4)|((m.cpl&0x40)?16:0),m.s2x,m.s2y,pal[1]);
    if(m.extra)for(const [c,x,y] of m.extra)drawS(c,x,y,pal[1]);
    if(!m.hideP)drawS((m.mol&15)|((m.cpl&0x20)?16:0),m.s1x,m.s1y,pal[0]);
  };
